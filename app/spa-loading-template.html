<!-- Cold-start splash (Nuxt spaLoadingTemplate). plugins/splash.client.ts lifts it out
     of Nuxt's loader so it stays up until the first screen has its data (useSplash).
     Background = hisaab_window (Android) = --bg. Icon: src-tauri/android/icon. -->
<script>
  // Saved theme (Settings → Theme) before anything paints.
  try {
    const t = localStorage.getItem('hisaab.theme')
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
  } catch {}
</script>
<div id="splash">
  <style>
    #splash {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 18px;
      background: #e2e5ea;
      color: #111;
      font:
        600 22px/1 system-ui,
        Roboto,
        sans-serif;
      letter-spacing: -0.01em;
    }
    #splash svg {
      width: 96px;
      height: 96px;
      animation: splash-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    #splash span {
      animation: splash-in 0.5s 0.08s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) #splash {
        background: #0e0e0e;
        color: #fafafa;
      }
    }
    :root[data-theme='dark'] #splash {
      background: #0e0e0e;
      color: #fafafa;
    }
    /* Leaving (composables/useSplash.ts): fades and opens up as the page rises in behind. */
    #splash {
      z-index: 1000;
      transition:
        opacity 0.4s ease,
        transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #splash.out {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }
    @keyframes splash-in {
      from {
        opacity: 0;
        transform: translateY(6px) scale(0.96);
      }
    }
  </style>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
    <g transform="translate(54 54) scale(1.22) rotate(-8) translate(-54 -54)">
      <path
        d="M30,24.5 L78,24.5 L78,84.5 L74,90.5 L70,84.5 L66,90.5 L62,84.5 L58,90.5 L54,84.5 L50,90.5 L46,84.5 L42,90.5 L38,84.5 L34,90.5 L30,84.5 Z"
        fill="#3B2A1A"
        fill-opacity="0.18"
      />
      <path
        d="M30,22 L78,22 L78,82 L74,88 L70,82 L66,88 L62,82 L58,88 L54,82 L50,88 L46,82 L42,88 L38,82 L34,88 L30,82 Z"
        fill="#FBF5EA"
        stroke="#D8CBB5"
        stroke-width="0.8"
        stroke-linejoin="round"
      />
      <path d="M38,36 L54,36" fill="none" stroke="#C49A5E" stroke-opacity="1.0" stroke-width="5.5" stroke-linecap="round" />
      <path d="M62,36 L70,36" fill="none" stroke="#C49A5E" stroke-opacity="1.0" stroke-width="5.5" stroke-linecap="round" />
      <path d="M38,50 L70,50" fill="none" stroke="#3B2A1A" stroke-opacity="1.0" stroke-width="6.5" stroke-linecap="round" />
      <path d="M46,64 L64,64" fill="none" stroke="#C49A5E" stroke-opacity="1.0" stroke-width="5.5" stroke-linecap="round" />

      <path d="M56,42.3 L63.7,50 L56,57.7 L48.3,50 Z" fill="#FBF5EA" />
      <path d="M56,44.5 L61.5,50 L56,55.5 L50.5,50 Z" fill="#D2553F" />
    </g>
  </svg>
  <span>Hisaab</span>
</div>
