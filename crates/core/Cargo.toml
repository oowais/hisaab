[package]
name = "hisaab-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Storage, occurrence and currency logic. No Tauri dependency: called from Tauri commands and from Kotlin via JNI."

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
rusqlite_migration = "2"
uuid = { version = "1", features = ["v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
